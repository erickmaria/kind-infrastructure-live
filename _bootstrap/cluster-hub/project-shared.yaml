apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shared
  namespace: argocd
spec:
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  description: hub project envrionment
  sourceRepos:
    - https://github.com/erickmaria/kind-infrastructure-live.git
  destinations:
    - server: "*"
      namespace: "*"

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: shared
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/erickmaria/kind-infrastructure-live.git
              revision: HEAD
              directories:
                - path: clusters/_shared/namespaces/*
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
              values:
                clusterDomain: '{{index .metadata.labels "cluster-domain"}}'
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{nameNormalized}}.{{path.basename}}'
      labels:
        cluster: '{{name}}'
    spec:
      project: shared
      source:
        repoURL: https://github.com/erickmaria/kind-infrastructure-live.git
        targetRevision: HEAD
        path: '{{path}}'
        kustomize:
          patches:
            - target:
                kind: Ingress
                name: argocd-server

              patch: |-
                - op: replace
                  path: /spec/rules/0/host
                  value: '{{ index .metadata.annotations "infrastructure.argocd.io/domain" }}'

      destination:
        server: '{{server}}'
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true