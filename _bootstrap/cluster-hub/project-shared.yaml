apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shared
  namespace: argocd
spec:
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  description: hub project envrionment
  sourceRepos:
    - https://github.com/erickmaria/kind-infrastructure-live.git

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: shared
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/erickmaria/kind-infrastructure-live.git
        revision: HEAD
        directories:
          - path: clusters/_shared/namespaces/*
    - clusters:
      selector:
        matchLabels:
          argocd.argoproj.io/secret-type: cluster
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{nameNormalized}}.{{path.basename}}'
      labels:
        cluster: '{{name}}'
    spec:
      project: hub
      source:
        repoURL: https://github.com/erickmaria/kind-infrastructure-live.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: '{{server}}'
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true