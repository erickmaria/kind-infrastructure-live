apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-01
  namespace: argocd
spec:
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  description: cluster-01 project envrionment
  sourceRepos:
    - https://github.com/erickmaria/kind-infrastructure-live.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/erickmaria/kind-infrastructure-live.git
        revision: HEAD
        directories:
          - path: clusters/cluster-01/namespaces/*
  template:
    metadata:
      name: 'cluster-01.{{path.basename}}'
    spec:
      project: cluster-01
      source:
        repoURL: https://github.com/erickmaria/kind-infrastructure-live.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          # prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true