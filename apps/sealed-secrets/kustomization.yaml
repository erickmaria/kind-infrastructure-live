apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sealed-secrets

resources:
  - namespace.yaml

helmCharts:
  - name: sealed-secrets
    repo: https://charts.bitnami.com/bitnami
    version: 2.16.1
    releaseName: sealed-secrets
    valuesInline:
      fullnameOverride: sealed-secrets
      controller:
        fullname: controller
