apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-apps
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/ORG/gitops.git
    targetRevision: HEAD
    path: clusters/prod/apps
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
