apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: cluster-config
  source:
    repoURL: https://github.com/erickmaria/gitops.git
    targetRevision: HEAD
    path: clusters/prod/platform
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
